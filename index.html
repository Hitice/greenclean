<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GreenClean</title>
  </head>
  <body>
    <div id="app">

      <header>
        <div class="logo">
          <img src="/logo.svg" alt="GreenClean" />
          <h1>Green<span>Clean</span></h1>
        </div>
        <div class="header-actions" id="header-actions">
          <button id="btn-open-settings" class="btn-ghost" data-i18n="btnSettings">Settings</button>
          <button id="btn-login" class="btn-primary" data-i18n="btnConnect">Connect</button>
        </div>
      </header>

      <main>
        <!-- Account Mismatch Alert -->
        <div class="card alert-card hidden" id="tab-account-alert">
          <div class="alert-body">
            <p class="alert-title" id="detected-account-title"></p>
            <p class="alert-desc" data-i18n="tabAccountDesc"></p>
          </div>
          <button id="btn-switch-detected" class="btn-primary btn-small" data-i18n="btnSwitchAccount"></button>
        </div>

        <!-- Stats + Actions Card -->
        <div class="card" id="dashboard">
          <p class="dashboard-hint" id="dashboard-hint" data-i18n="hintConnectToStart"></p>
          <div class="stats-grid hidden" id="stats-grid">
            <div class="stat-item">
              <span class="stat-label" data-i18n="statTotal"></span>
              <span class="stat-value" id="stat-total">-</span>
            </div>
            <div class="stat-item danger">
              <span class="stat-label" data-i18n="statToDelete"></span>
              <span class="stat-value" id="stat-to-delete">-</span>
            </div>
          </div>

          <div class="actions">
            <button id="btn-scan" class="btn-secondary" disabled data-i18n="btnScan"></button>
            <button id="btn-clean" class="btn-danger" disabled data-i18n="btnReviewTrash"></button>
            <button id="btn-cancel-scan" class="btn-ghost hidden" data-i18n="btnCancelScan"></button>
          </div>
          <div id="post-clean-actions" class="actions hidden">
            <button id="btn-back-home" class="btn-ghost" data-i18n="btnBackHome"></button>
            <button id="btn-rescan" class="btn-secondary" data-i18n="btnRescan"></button>
          </div>

          <div class="progress-container hidden" id="scan-progress">
            <div class="progress-bar">
              <div class="progress-fill" id="progress-fill"></div>
            </div>
            <p id="progress-status" data-i18n="progressInit"></p>
          </div>
        </div>

        <!-- Category Cards (checkboxes) -->
        <div id="category-cards" class="hidden"></div>

        <!-- Subscription Alert -->
        <div class="card alert-card hidden" id="subscription-alert">
          <div class="alert-body">
            <p class="alert-title" id="sub-title"></p>
            <p class="alert-desc" data-i18n="subsAlertDesc"></p>
          </div>
          <button id="btn-view-subs" class="btn-ghost btn-small" data-i18n="btnViewList"></button>
        </div>

        <!-- Summary Table -->
        <div class="card result-card hidden" id="email-preview">
          <table>
            <thead>
              <tr><th data-i18n="thCategory"></th><th data-i18n="thCount"></th></tr>
            </thead>
            <tbody id="email-items"></tbody>
          </table>
        </div>
      </main>

      <footer>
        <div class="footer-accent"></div>
        <p data-i18n="footer"></p>
      </footer>

    </div><!-- /#app -->

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <div class="modal-content">
        <h3 id="settings-title" data-i18n="settingsTitle"></h3>

        <div class="form-group">
          <label for="plan-mode" data-i18n="planModeLabel"></label>
          <select id="plan-mode" class="input-select">
            <option value="free" data-i18n="planFree"></option>
            <option value="cloud" data-i18n="planCloud"></option>
            <option value="advanced" data-i18n="planAdvanced"></option>
          </select>
        </div>

        <div id="cloud-panel" class="form-group cloud-panel hidden">
          <p class="small-text" data-i18n="cloudPanelDesc"></p>
          <label for="cloud-api-base" data-i18n="cloudUrlLabel"></label>
          <input type="url" id="cloud-api-base" data-i18n-placeholder="cloudUrlPlaceholder" autocomplete="off">
          <label for="cloud-token" class="mt-8" data-i18n="cloudTokenLabel"></label>
          <input type="password" id="cloud-token" data-i18n-placeholder="cloudTokenPlaceholder" autocomplete="off">
          <a id="cloud-subscribe-link" class="link-inline" href="#" target="_blank" rel="noopener" data-i18n="cloudSubscribe"></a>
        </div>

        <div id="advanced-panel" class="advanced-panel hidden">
          <p class="small-text" data-i18n="advancedPanelDesc"></p>
          <div class="form-group">
            <label for="provider-select" data-i18n="providerLabel"></label>
            <select id="provider-select" class="input-select">
              <!-- Filled in by main.js -->
            </select>
          </div>
          <div class="form-group" id="api-key-group">
            <label for="api-key" data-i18n="apiKeyLabel"></label>
            <input type="password" id="api-key" data-i18n-placeholder="apiKeyPlaceholder" autocomplete="off">
          </div>
          <div class="form-group" id="model-row">
            <label for="model-input"><span data-i18n="modelLabel"></span> <span class="label-hint" data-i18n="optionalHint"></span></label>
            <input type="text" id="model-input" data-i18n-placeholder="modelPlaceholder">
          </div>
          <div class="form-group hidden" id="ollama-url-row">
            <label for="ollama-url" data-i18n="ollamaUrlLabel"></label>
            <input type="text" id="ollama-url" placeholder="http://127.0.0.1:11434">
          </div>
        </div>

        <div class="form-group" id="ai-privacy-group">
          <label class="check-row">
            <input type="checkbox" id="ai-send-snippet" checked>
            <span data-i18n="aiSendSnippet"></span>
          </label>
          <label class="check-row">
            <input type="checkbox" id="ai-mask-sensitive" checked>
            <span data-i18n="aiMaskSensitive"></span>
          </label>
        </div>

        <p class="small-text" id="settings-hint-bottom"></p>

        <div class="modal-actions">
          <button id="btn-close-settings" class="btn-ghost" data-i18n="btnCancel"></button>
          <button id="btn-save-settings" class="btn-primary" data-i18n="btnSave"></button>
        </div>
      </div>
    </div>

    <!-- Subscriptions Modal -->
    <div id="subs-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="subs-title">
      <div class="modal-content">
        <h3 id="subs-title" data-i18n="subsTitle"></h3>
        <p class="small-text" data-i18n="subsDesc"></p>
        <div class="form-group">
          <label class="check-row">
            <input type="checkbox" id="subs-select-all" checked>
            <span data-i18n="subsSelectAll"></span>
          </label>
          <label class="check-row">
            <input type="checkbox" id="subs-use-general-unsub" checked>
            <span data-i18n="subsUseGeneralUnsub"></span>
          </label>
          <label class="check-row">
            <input type="checkbox" id="subs-trash-after" checked>
            <span data-i18n="subsTrashAfter"></span>
          </label>
        </div>
        <div class="subs-list" id="subs-list"></div>
        <div class="modal-actions">
          <button id="btn-close-subs" class="btn-ghost" data-i18n="btnClose"></button>
          <button id="btn-trash-subs" class="btn-danger" data-i18n="btnTrashSelected"></button>
        </div>
      </div>
    </div>

    <!-- Trash Preview Modal -->
    <div id="trash-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="trash-title">
      <div class="modal-content">
        <h3 id="trash-title" data-i18n="previewTitle"></h3>
        <p class="small-text" data-i18n="previewDesc"></p>
        <div class="preview-toolbar">
          <label class="check-row">
            <input type="checkbox" id="trash-select-all" checked>
            <span data-i18n="previewSelectAll"></span>
          </label>
          <span class="preview-count" id="trash-count"></span>
        </div>
        <div class="subs-list preview-list" id="trash-list"></div>
        <div class="modal-actions">
          <button id="btn-close-trash" class="btn-ghost" data-i18n="btnCancel"></button>
          <button id="btn-confirm-trash" class="btn-danger"></button>
        </div>
      </div>
    </div>

    <div id="toast-container" class="toast-container" aria-live="polite" aria-atomic="true"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
