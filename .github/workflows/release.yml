name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Check that the tag matches the manifest version
        run: |
          version="${GITHUB_REF_NAME#v}"
          manifest_version="$(node -p "require('./manifest.json').version")"
          if [ "$version" != "$manifest_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest.json version $manifest_version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Package dist/
        run: cd dist && zip -r -X "../greenclean-${VERSION}.zip" .

      - uses: softprops/action-gh-release@v2
        with:
          files: greenclean-${{ env.VERSION }}.zip
          generate_release_notes: true
